# systemd drop-in to cap the memory of the mailmcp service.
# NOT applied automatically: Mas generates the unit, this repo does not contain it.
# Install on the server as:
#   /etc/systemd/system/<mailmcp-unit-name>.service.d/memory-limit.conf
# then run: systemctl daemon-reload && systemctl restart <mailmcp-unit-name>
#
# TODO (administrator): replace the placeholder below with a value chosen for this
# server's RAM and the service's real usage (e.g. 512M), and uncomment the line.
# The unit name and the right value are facts only the administrator knows.
[Service]
#MemoryMax=<TO_BE_DEFINED, e.g. 512M>
